spring:
  application:
    name: controle-gastos-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/controle_gastos}
    username: ${DATABASE_USERNAME:controle_gastos}
    password: ${DATABASE_PASSWORD:change-me-local}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${GMAIL_SMTP_HOST:}
    port: ${GMAIL_SMTP_PORT:587}
    username: ${GMAIL_SMTP_USERNAME:}
    password: ${GMAIL_SMTP_APP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

app:
  auth:
    issuer: ${AUTH_JWT_ISSUER:controle-gastos-api}
    audience: ${AUTH_JWT_AUDIENCE:controle-gastos-clients}
    access-token-lifetime: ${AUTH_ACCESS_TOKEN_LIFETIME:15m}
    refresh-idle-lifetime: ${AUTH_REFRESH_IDLE_LIFETIME:30d}
    session-absolute-lifetime: ${AUTH_SESSION_ABSOLUTE_LIFETIME:365d}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-name: ${AUTH_COOKIE_NAME:__Secure-refresh_token}
    jwt-secret: ${AUTH_JWT_SECRET:}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    attempt-hmac-secret: ${AUTH_ATTEMPT_HMAC_SECRET:local-only-change-me}
    password-reset:
      public-url: ${AUTH_PUBLIC_APP_URL:}
      mail-enabled: ${AUTH_PASSWORD_RESET_MAIL_ENABLED:false}
      from: ${GMAIL_SMTP_FROM:}
    totp:
      encryption-key: ${AUTH_TOTP_ENCRYPTION_KEY:}
      encryption-key-version: ${AUTH_TOTP_ENCRYPTION_KEY_VERSION:1}
    mfa:
      login-challenge-lifetime: ${AUTH_MFA_LOGIN_CHALLENGE_LIFETIME:5m}
      pending-setup-lifetime: ${AUTH_MFA_PENDING_SETUP_LIFETIME:10m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
