spring:
  application:
    name: controle-gastos-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/controle_gastos}
    username: ${DATABASE_USERNAME:controle_gastos}
    password: ${DATABASE_PASSWORD:change-me-local}
app:
  auth:
    cookie-secure: false
    cookie-name: refresh_token
    issuer: ${AUTH_JWT_ISSUER:controle-gastos-api}
    audience: ${AUTH_JWT_AUDIENCE:controle-gastos-clients}
    access-token-lifetime: ${AUTH_ACCESS_TOKEN_LIFETIME:15m}
    refresh-idle-lifetime: ${AUTH_REFRESH_IDLE_LIFETIME:30d}
    session-absolute-lifetime: ${AUTH_SESSION_ABSOLUTE_LIFETIME:365d}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-name: ${AUTH_COOKIE_NAME:__Secure-refresh_token}
    jwt-secret: ${AUTH_JWT_SECRET:}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    attempt-hmac-secret: ${AUTH_ATTEMPT_HMAC_SECRET:local-only-change-me}
    password-reset:
      public-url: ${AUTH_PUBLIC_APP_URL:http://localhost:3000}
      mail-enabled: ${AUTH_PASSWORD_RESET_MAIL_ENABLED:false}
      from: ${GMAIL_SMTP_FROM:}
