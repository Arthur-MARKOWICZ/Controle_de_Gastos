name: Testar deploy de contêineres

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  validate:
    name: Validar e testar
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Obter código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Configurar pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json

      - name: Configurar Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Validar aplicação
        run: |
          set -Eeuo pipefail
          cd web && pnpm install --frozen-lockfile
          cd .. && make check

  deploy:
    name: Construir e publicar contêineres
    needs: validate
    runs-on: ubuntu-24.04
    environment: deploy-test
    timeout-minutes: 45

    steps:
      - name: Obter código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Construir imagens
        env:
          TEST_API_URL: ${{ vars.TEST_API_URL }}
        run: |
          set -Eeuo pipefail
          API_URL="${TEST_API_URL:-http://localhost:8080}"
          case "$API_URL" in
            http://*|https://*) ;;
            *) echo "TEST_API_URL deve iniciar com http:// ou https://" >&2; exit 1 ;;
          esac
          docker build --pull --tag controle-gastos-backend:latest backend
          docker build --pull \
            --build-arg "NEXT_PUBLIC_API_URL=$API_URL" \
            --tag controle-gastos-web:latest web

      - name: Configurar SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Preparar diretório na VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test "$DEPLOY_USER" = deploy
          readonly SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          "${SSH[@]}" true
          "${SSH[@]}" '
            set -eu
            if [ ! -d /srv/controle-gastos ]; then
              sudo -n /usr/bin/install -d -o deploy -g deploy -m 0750 /srv/controle-gastos || {
                echo "Não foi possível criar /srv/controle-gastos. Configure o sudo NOPASSWD documentado." >&2
                exit 1
              }
            fi
            if [ ! -w /srv/controle-gastos ]; then
              echo "O usuário deploy não pode escrever em /srv/controle-gastos." >&2
              exit 1
            fi
          '

      - name: Enviar e validar Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          readonly SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          readonly SCP=(scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT")
          "${SCP[@]}" compose.yaml "$DEPLOY_USER@$DEPLOY_HOST:/srv/controle-gastos/compose.yaml.next"
          "${SSH[@]}" '
            set -eu
            cd /srv/controle-gastos
            trap "rm -f compose.yaml.next" EXIT
            chmod 0640 compose.yaml.next
            docker compose --project-name controle-gastos -f compose.yaml.next config --quiet
            mv -f compose.yaml.next compose.yaml
            trap - EXIT
          '

      - name: Enviar imagens e atualizar containers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          readonly SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          docker image save controle-gastos-backend:latest | gzip -1 | "${SSH[@]}" 'docker image load --quiet'
          docker image save controle-gastos-web:latest | gzip -1 | "${SSH[@]}" 'docker image load --quiet'
          "${SSH[@]}" '
            set -eu
            cd /srv/controle-gastos
            docker image inspect controle-gastos-backend:latest >/dev/null
            docker image inspect controle-gastos-web:latest >/dev/null
            docker image inspect postgres:18-alpine >/dev/null 2>&1 || docker pull postgres:18-alpine
            docker compose --project-name controle-gastos -f compose.yaml up \
              --detach \
              --no-build \
              --pull never \
              --wait \
              --wait-timeout 120 \
              postgres
            docker compose --project-name controle-gastos -f compose.yaml up \
              --detach \
              --no-deps \
              --no-build \
              --pull never \
              --force-recreate \
              --remove-orphans \
              backend web
            docker compose --project-name controle-gastos -f compose.yaml ps
          '
