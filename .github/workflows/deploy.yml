name: Validar e implantar aplicação

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validar e testar
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Obter código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Configurar pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json

      - name: Configurar Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Validar aplicação
        run: |
          set -Eeuo pipefail
          cd web && pnpm install --frozen-lockfile
          cd .. && make check

  deploy:
    name: Construir e publicar em produção
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Obter código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Construir imagens
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: |
          set -Eeuo pipefail
          test -n "$PUBLIC_APP_URL"
          case "$PUBLIC_APP_URL" in
            https://*) ;;
            *) echo "PUBLIC_APP_URL deve iniciar com https://" >&2; exit 1 ;;
          esac
          APP_DOMAIN="${PUBLIC_APP_URL#https://}"
          case "$APP_DOMAIN" in
            ""|*/*|*:*|*\?*|*\#*)
              echo "PUBLIC_APP_URL deve conter somente https:// seguido do domínio, sem porta, caminho, query ou fragmento" >&2
              exit 1
              ;;
          esac
          printf '%s' "$APP_DOMAIN" \
            | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$' \
            || { echo "PUBLIC_APP_URL deve conter um domínio completo válido" >&2; exit 1; }
          docker build --pull --tag controle-gastos-backend:latest backend
          docker build --pull \
            --build-arg "NEXT_PUBLIC_API_URL=$PUBLIC_APP_URL" \
            --tag controle-gastos-web:latest web

      - name: Configurar SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Preparar diretório na VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test "$DEPLOY_USER" = deploy
          readonly SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          "${SSH[@]}" true
          "${SSH[@]}" '
            set -eu
            if [ ! -d /srv/controle-gastos ]; then
              sudo -n /usr/bin/install -d -o deploy -g deploy -m 0750 /srv/controle-gastos || {
                echo "Não foi possível criar /srv/controle-gastos. Configure o sudo NOPASSWD documentado." >&2
                exit 1
              }
            fi
            if [ ! -w /srv/controle-gastos ]; then
              echo "O usuário deploy não pode escrever em /srv/controle-gastos." >&2
              exit 1
            fi
          '

      - name: Enviar e validar Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          readonly SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          readonly SCP=(scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT")
          "${SCP[@]}" compose.yaml "$DEPLOY_USER@$DEPLOY_HOST:/srv/controle-gastos/compose.yaml.next"
          "${SSH[@]}" '
            set -eu
            cd /srv/controle-gastos
            trap "rm -f compose.yaml.next" EXIT
            chmod 0640 compose.yaml.next
            COMPOSE_DISABLE_ENV_FILE=1 \
            POSTGRES_DB=controle_gastos \
            POSTGRES_USER=controle_gastos \
            POSTGRES_PASSWORD=validation-only-password \
            POSTGRES_BIND_ADDRESS=127.0.0.1 \
            BACKEND_BIND_ADDRESS=127.0.0.1 \
            WEB_BIND_ADDRESS=127.0.0.1 \
            AUTH_COOKIE_SECURE=true \
            AUTH_COOKIE_NAME=__Secure-refresh_token \
            AUTH_JWT_SECRET=validation-only-jwt-secret-at-least-32-bytes \
            AUTH_ALLOWED_ORIGINS=https://gastos.example.com \
            AUTH_ATTEMPT_HMAC_SECRET=validation-only-attempt-secret-at-least-32-bytes \
            AUTH_TOTP_ENCRYPTION_KEY=validation-only-base64-totp-key \
            NEXT_PUBLIC_API_URL=https://gastos.example.com \
              docker compose --project-name controle-gastos -f compose.yaml.next config --quiet
            mv -f compose.yaml.next compose.yaml
            trap - EXIT
          '

      - name: Enviar imagens e atualizar containers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          AUTH_ATTEMPT_HMAC_SECRET: ${{ secrets.AUTH_ATTEMPT_HMAC_SECRET }}
          AUTH_TOTP_ENCRYPTION_KEY: ${{ secrets.AUTH_TOTP_ENCRYPTION_KEY }}
          GMAIL_SMTP_USERNAME: ${{ secrets.GMAIL_SMTP_USERNAME }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$PUBLIC_APP_URL"
          test -n "$POSTGRES_DB"
          test -n "$POSTGRES_USER"
          test -n "$POSTGRES_PASSWORD"
          test "${#AUTH_JWT_SECRET}" -ge 32
          test "${#AUTH_ATTEMPT_HMAC_SECRET}" -ge 32
          test -n "$AUTH_TOTP_ENCRYPTION_KEY"
          test -n "$GMAIL_SMTP_USERNAME"
          test -n "$GMAIL_SMTP_APP_PASSWORD"
          # Login social é um método adicional, não obrigatório para o deploy: os quatro
          # valores abaixo podem ficar vazios até o Google/GitHub OAuth App ser configurado.
          case "$PUBLIC_APP_URL" in
            https://*) ;;
            *) echo "PUBLIC_APP_URL deve iniciar com https://" >&2; exit 1 ;;
          esac
          APP_DOMAIN="${PUBLIC_APP_URL#https://}"
          printf '%s' "$APP_DOMAIN" \
            | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$' \
            || { echo "PUBLIC_APP_URL deve conter um domínio completo válido" >&2; exit 1; }
          case "$POSTGRES_DB" in
            *[!A-Za-z0-9_]*) echo "POSTGRES_DB aceita apenas letras, números e underscore" >&2; exit 1 ;;
          esac
          case "$POSTGRES_USER" in
            *[!A-Za-z0-9_]*) echo "POSTGRES_USER aceita apenas letras, números e underscore" >&2; exit 1 ;;
          esac
          for VALUE in "$PUBLIC_APP_URL" "$POSTGRES_DB" "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$AUTH_JWT_SECRET" "$AUTH_ATTEMPT_HMAC_SECRET" "$AUTH_TOTP_ENCRYPTION_KEY" "$GMAIL_SMTP_USERNAME" "$GMAIL_SMTP_APP_PASSWORD" "$GOOGLE_OAUTH_CLIENT_ID" "$GOOGLE_OAUTH_CLIENT_SECRET" "$GITHUB_OAUTH_CLIENT_ID" "$GITHUB_OAUTH_CLIENT_SECRET"; do
            case "$VALUE" in
              *$'\n'*) echo "Variáveis de produção não podem conter quebra de linha" >&2; exit 1 ;;
            esac
          done
          readonly SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          echo ">>> Enviando imagem backend..."
          docker image save controle-gastos-backend:latest | gzip -1 | "${SSH[@]}" 'docker image load --quiet'
          echo ">>>Backend enviado com sucesso, enviando web..."
          docker image save controle-gastos-web:latest | gzip -1 | "${SSH[@]}" 'docker image load --quiet'
          echo ">>> Web enviada com sucesso, executando script remoto..."

          {
            printf 'export PUBLIC_APP_URL=%q\n' "$PUBLIC_APP_URL"
            printf 'export POSTGRES_DB=%q\n' "$POSTGRES_DB"
            printf 'export POSTGRES_USER=%q\n' "$POSTGRES_USER"
            printf 'export POSTGRES_PASSWORD=%q\n' "$POSTGRES_PASSWORD"
            printf 'export AUTH_JWT_SECRET=%q\n' "$AUTH_JWT_SECRET"
            printf 'export AUTH_ATTEMPT_HMAC_SECRET=%q\n' "$AUTH_ATTEMPT_HMAC_SECRET"
            printf 'export AUTH_TOTP_ENCRYPTION_KEY=%q\n' "$AUTH_TOTP_ENCRYPTION_KEY"
            printf 'export GMAIL_SMTP_USERNAME=%q\n' "$GMAIL_SMTP_USERNAME"
            printf 'export GMAIL_SMTP_APP_PASSWORD=%q\n' "$GMAIL_SMTP_APP_PASSWORD"
            printf 'export GOOGLE_OAUTH_CLIENT_ID=%q\n' "$GOOGLE_OAUTH_CLIENT_ID"
            printf 'export GOOGLE_OAUTH_CLIENT_SECRET=%q\n' "$GOOGLE_OAUTH_CLIENT_SECRET"
            printf 'export GITHUB_OAUTH_CLIENT_ID=%q\n' "$GITHUB_OAUTH_CLIENT_ID"
            printf 'export GITHUB_OAUTH_CLIENT_SECRET=%q\n' "$GITHUB_OAUTH_CLIENT_SECRET"
            cat <<'REMOTE_SCRIPT'
            set -Eeuo pipefail
            set +x
            cd /srv/controle-gastos
            export COMPOSE_DISABLE_ENV_FILE=1
            export POSTGRES_BIND_ADDRESS=127.0.0.1
            export BACKEND_BIND_ADDRESS=127.0.0.1
            export WEB_BIND_ADDRESS=127.0.0.1
            export AUTH_COOKIE_SECURE=true
            export AUTH_COOKIE_NAME=__Secure-refresh_token
            export AUTH_ALLOWED_ORIGINS="$PUBLIC_APP_URL"
            export AUTH_PASSWORD_RESET_MAIL_ENABLED=true
            export NEXT_PUBLIC_API_URL="$PUBLIC_APP_URL"

            set -eu
            docker image inspect controle-gastos-backend:latest >/dev/null
            docker image inspect controle-gastos-web:latest >/dev/null
            docker image inspect postgres:18-alpine >/dev/null 2>&1 || docker pull postgres:18-alpine
            docker compose --project-name controle-gastos -f compose.yaml config --quiet
            docker compose --project-name controle-gastos -f compose.yaml up \
              --detach \
              --no-build \
              --pull never \
              --wait \
              --wait-timeout 120 \
              postgres
            printf '%s\n' \
              '\getenv role POSTGRES_USER' \
              '\getenv password POSTGRES_PASSWORD' \
              "SELECT format('ALTER ROLE %I WITH PASSWORD %L', :'role', :'password') \gexec" \
              | docker compose --project-name controle-gastos -f compose.yaml exec --no-TTY postgres \
                  psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set ON_ERROR_STOP=1
            docker compose --project-name controle-gastos -f compose.yaml up \
              --detach \
              --no-deps \
              --no-build \
              --pull never \
              --force-recreate \
              --remove-orphans \
              backend web
            docker compose --project-name controle-gastos -f compose.yaml ps
            command -v curl >/dev/null 2>&1 || {
              echo "curl não está instalado na VPS" >&2
              exit 1
            }
            wait_for_http() {
              url=$1
              service=$2
              attempt=1
              while ! curl --fail --silent --show-error "$url" >/dev/null 2>&1; do
                if [ "$attempt" -ge 60 ]; then
                  echo "$service não respondeu após 120 segundos" >&2
                  return 1
                fi
                attempt=$((attempt + 1))
                sleep 2
              done
            }
            wait_for_http http://127.0.0.1:8080/actuator/health/readiness backend
            wait_for_http http://127.0.0.1:3000/ web
          REMOTE_SCRIPT
          } | "${SSH[@]}" 'bash -se'
