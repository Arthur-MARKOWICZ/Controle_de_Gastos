openapi: 3.1.0
info:
  title: Controle de gastos API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: Solicita cadastro público
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCredentials' }
      responses:
        '202':
          description: Resposta idêntica para conta criada, existente ou tentativa limitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /auth/login:
    post:
      summary: Autentica por e-mail e senha
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginCredentials' }
      responses:
        '200':
          description: >-
            Sem MFA: access token, refresh enviado somente por Set-Cookie.
            Com MFA ativo: desafio de segundo fator, sem Set-Cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: >-
                __Secure-refresh_token; Secure; HttpOnly; SameSite=Strict;
                Path=/api/v1/auth. Ausente quando a resposta é um MfaChallenge.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Token'
                  - $ref: '#/components/schemas/MfaChallenge'
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
  /auth/mfa/verify:
    post:
      summary: Confirma o segundo fator (TOTP) de um login pendente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200':
          description: Access token; refresh é enviado somente por Set-Cookie
          headers:
            Set-Cookie:
              schema: { type: string }
              description: __Secure-refresh_token; Secure; HttpOnly; SameSite=Strict; Path=/api/v1/auth
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
  /auth/mfa/recovery:
    post:
      summary: Consome um recovery code e inicia uma sessão restrita de recuperação
      description: >-
        A sessão restrita retornada só acessa /mfa/enroll e /mfa/enroll/confirm;
        qualquer outro endpoint responde 403. Não cria auth_session nem Set-Cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaRecoveryRequest' }
      responses:
        '200':
          description: Token restrito, válido apenas para concluir a configuração de um novo TOTP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictedToken' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
  /auth/refresh:
    post:
      summary: Rotaciona o refresh e emite novo access token
      responses:
        '200':
          description: Tokens renovados; substitui o cookie anterior
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
  /auth/logout:
    post:
      summary: Revoga imediatamente a sessão atual
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Sessão revogada e cookie removido }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
  /auth/password-reset-requests:
    post:
      summary: Solicita instruções para redefinir a senha
      description: Sempre retorna a mesma resposta para e-mail existente, inexistente ou limitado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: Solicitação recebida; não confirma a existência da conta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /auth/password-resets:
    post:
      summary: Redefine a senha usando o token recebido por e-mail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmation' }
      responses:
        '204': { description: Senha alterada, sessões revogadas e refresh cookie removido }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /auth/password:
    post:
      summary: Cadastra uma senha para uma conta criada por login social
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddPasswordRequest' }
      responses:
        '204': { description: Senha cadastrada }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409':
          description: A conta já tem senha (code PASSWORD_ALREADY_SET)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/login-methods:
    get:
      summary: Lista como a conta autenticada consegue entrar
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Métodos de login da conta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginMethods' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
  /auth/oauth/{provider}/authorize-url:
    post:
      summary: Devolve a URL de autorização do provedor
      description: >-
        Sem Bearer inicia um login; com Bearer vincula o provedor à conta
        autenticada. Usado pelo cliente web, que navega até a URL devolvida.
      parameters: [{ $ref: '#/components/parameters/OAuthProvider' }]
      responses:
        '200':
          description: URL de autorização
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationUrl' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /auth/oauth/{provider}/start:
    get:
      summary: Redireciona o navegador do sistema para o provedor
      description: >-
        Ponto de entrada do login social em cliente nativo (ADR-020). O
        aplicativo abre esta rota em Custom Tabs ou ASWebAuthenticationSession,
        nunca em WebView embutida. Com client=mobile a sessão volta por código de
        handoff no App Link, em vez de cookie.
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - name: client
          in: query
          required: false
          schema: { type: string, enum: [mobile] }
      responses:
        '302': { description: Redirecionamento para a autorização do provedor }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /auth/oauth/{provider}/callback:
    get:
      summary: Conclui o fluxo OAuth e devolve o navegador ao cliente
      description: >-
        Sempre responde 302. Para o cliente web, entrega a sessão em Set-Cookie e
        redireciona para /oauth/callback. Para o cliente nativo, redireciona para
        o App Link com o código de handoff. Ao vincular, volta para
        /conta/seguranca. Falhas voltam com error=oauth_failed.
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
      responses:
        '302': { description: Redirecionamento para o cliente, com ou sem refresh cookie }
  /auth/oauth/mobile-handoff:
    post:
      summary: Troca o código de handoff pela sessão, uma única vez
      description: >-
        O refresh volta no corpo, e não em cookie, porque o navegador do sistema
        não o compartilha com o aplicativo nativo. O código vale por 60 segundos
        e é consumido na primeira troca (ADR-020).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobileHandoffRequest' }
      responses:
        '200':
          description: Sessão criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileSession' }
        '400':
          description: Código ausente, expirado ou já consumido (code OAUTH_LOGIN_FAILED)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
  /auth/oauth/{provider}:
    delete:
      summary: Desconecta um provedor da conta autenticada
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OAuthProvider' }]
      responses:
        '204': { description: Provedor desconectado }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409':
          description: É o último método de login da conta (code LAST_LOGIN_METHOD)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /mfa/enroll:
    post:
      summary: Inicia a configuração de MFA por TOTP
      description: >-
        Exige a senha atual; invalida qualquer configuração pendente anterior.
        Aceita tanto uma sessão normal quanto o token restrito emitido por
        /auth/mfa/recovery; neste último caso substitui um TOTP já ativo.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
      responses:
        '200':
          description: QR Code e chave manual para configurar o aplicativo autenticador
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollmentStart' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/MfaAlreadyEnabled' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
  /mfa/enroll/confirm:
    post:
      summary: Confirma o primeiro código TOTP e ativa o MFA
      description: >-
        Em sucesso, revoga todas as sessões (inclusive a atual) e emite dez
        recovery codes, exibidos apenas nesta resposta. Aceita tanto uma
        sessão normal quanto o token restrito de /auth/mfa/recovery; neste
        caso nenhum token/cookie de login é retornado, exigindo novo login.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaCodeConfirmation' }
      responses:
        '200':
          description: MFA ativo; recovery codes exibidos uma única vez
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaRecoveryCodes' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
  /mfa/disable:
    post:
      summary: Desativa o MFA
      description: Exige a senha atual; revoga todas as sessões do usuário.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
      responses:
        '204': { description: MFA desativado e sessões revogadas }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/MfaNotEnabled' }
  /mfa/recovery-codes:
    post:
      summary: Gera dez novos recovery codes, invalidando os anteriores
      description: Exige a senha atual; não revoga sessões existentes.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
      responses:
        '200':
          description: Novos recovery codes, exibidos uma única vez
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaRecoveryCodes' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/MfaNotEnabled' }
  /mfa/status:
    get:
      summary: Consulta o estado atual do MFA da conta autenticada
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Estado do MFA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/me:
    get:
      summary: Retorna a conta autenticada
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Conta atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /income:
    put:
      summary: Configura ou altera a renda do mês corrente
      description: A vigência usa America/Sao_Paulo. Repetir o mesmo valor é idempotente.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncomeChange' }
      responses:
        '200':
          description: Renda aplicável ao mês corrente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/IncomeConflict' }
    get:
      summary: Consulta a renda aplicável a um mês
      description: Sem o parâmetro month, consulta o mês corrente em America/Sao_Paulo.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: month
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          description: Mês no formato YYYY-MM.
      responses:
        '200':
          description: Renda efetiva no mês consultado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '404': { $ref: '#/components/responses/IncomeNotConfigured' }
  /income/history:
     get:
       summary: Lista alterações reais da renda do usuário autenticado
       security: [{ bearerAuth: [] }]
       parameters:
         - in: query
           name: page
           schema: { type: integer, minimum: 0, default: 0 }
         - in: query
           name: size
           schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
       responses:
         '200':
           description: Histórico em ordem decrescente de alteração
           content:
             application/json:
               schema: { $ref: '#/components/schemas/IncomeHistoryPage' }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
  /envelopes:
     get:
       summary: Lista verbas visíveis ao usuário (owner ou participante)
       description: >
         Os campos available, isNegative e goalProgress nesta resposta NÃO são saldo autoritativo;
         available espelha baseAmount e isNegative é sempre false. Use GET /ledger/summary para saldo real.
       security: [{ bearerAuth: [] }]
       parameters:
         - in: query
           name: month
           schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
           description: Mês no formato YYYY-MM; padrão mês corrente em America/Sao_Paulo.
       responses:
         '200':
           description: Lista de verbas (saldo autoritativo apenas via /ledger/summary)
           content:
             application/json:
               schema: { type: array, items: { $ref: '#/components/schemas/Envelope' } }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
     post:
       summary: Cria nova verba
       security: [{ bearerAuth: [] }]
       requestBody:
         required: true
         content:
           application/json:
             schema: { $ref: '#/components/schemas/CreateEnvelope' }
       responses:
         '201':
           description: Verba criada
           content:
             application/json:
               schema: { $ref: '#/components/schemas/Envelope' }
         '400':
           description: Dados inválidos, ou soma das verbas-base excede a renda (code allocation.exceeds_income)
           content:
             application/problem+json:
               schema: { $ref: '#/components/schemas/Problem' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
  /envelopes/{id}:
     get:
       summary: Detalha uma verba
       description: >
         available/isNegative/goalProgress nesta resposta não são saldo autoritativo;
         use GET /ledger/summary.
       security: [{ bearerAuth: [] }]
       parameters:
         - in: path
           name: id
           required: true
           schema: { type: string, format: uuid }
       responses:
         '200':
           description: Verba encontrada
           content:
             application/json:
               schema: { $ref: '#/components/schemas/Envelope' }
         '404': { $ref: '#/components/responses/NotFound' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
     patch:
       summary: Atualiza nome, propósito ou valor-base da verba (somente owner)
       description: Requer version do GET/summary; conflito de versão retorna 409 ENVELOPE_CONCURRENT_CHANGE.
       security: [{ bearerAuth: [] }]
       parameters:
         - in: path
           name: id
           required: true
           schema: { type: string, format: uuid }
       requestBody:
         required: true
         content:
           application/json:
             schema: { $ref: '#/components/schemas/UpdateEnvelope' }
       responses:
         '200':
           description: Verba atualizada
           content:
             application/json:
               schema: { $ref: '#/components/schemas/Envelope' }
         '400':
           description: Dados inválidos, ou soma das verbas-base excede a renda (code allocation.exceeds_income)
           content:
             application/problem+json:
               schema: { $ref: '#/components/schemas/Problem' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
         '409':
           description: Conflito de versão otimista (code ENVELOPE_CONCURRENT_CHANGE)
           content:
             application/problem+json:
               schema: { $ref: '#/components/schemas/Problem' }
  /envelopes/{id}/archive:
     post:
       summary: Arquiva verba (idempotente, somente owner)
       security: [{ bearerAuth: [] }]
       parameters:
         - in: path
           name: id
           required: true
           schema: { type: string, format: uuid }
       responses:
         '204': { description: Verba arquivada }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
  /envelopes/{id}/participants:
     get:
       summary: Lista participantes da verba (somente owner)
       security: [{ bearerAuth: [] }]
       parameters:
         - in: path
           name: id
           required: true
           schema: { type: string, format: uuid }
       responses:
         '200':
           description: Participantes ativos
           content:
             application/json:
               schema: { $ref: '#/components/schemas/ParticipantList' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
     post:
       summary: Convida usuário com e-mail verificado (somente owner)
       description: >
         Conta inexistente ou não verificada recebe erro genérico (sem enumerar contas).
         Aceite por token/e-mail fica fora deste corte (ADR-0026).
       security: [{ bearerAuth: [] }]
       parameters:
         - in: path
           name: id
           required: true
           schema: { type: string, format: uuid }
       requestBody:
         required: true
         content:
           application/json:
             schema: { $ref: '#/components/schemas/InviteParticipant' }
       responses:
         '201':
           description: Participante adicionado (ou já existente)
           content:
             application/json:
               schema: { $ref: '#/components/schemas/Participant' }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
  /envelopes/{id}/participants/{userId}:
     delete:
       summary: Remove participante da verba (somente owner)
       security: [{ bearerAuth: [] }]
       parameters:
         - in: path
           name: id
           required: true
           schema: { type: string, format: uuid }
         - in: path
           name: userId
           required: true
           schema: { type: string, format: uuid }
       responses:
         '204': { description: Participante removido }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
  /envelopes/{id}/entries:
     get:
       summary: Lista movimentações de uma verba (filtro por mês)
       security: [{ bearerAuth: [] }]
       parameters:
         - in: path
           name: id
           required: true
           schema: { type: string, format: uuid }
         - in: query
           name: month
           schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
         - in: query
           name: page
           schema: { type: integer, minimum: 0, default: 0 }
         - in: query
           name: size
           schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
         - in: query
           name: kind
           schema: { type: string, enum: [EXPENSE, CONTRIBUTION] }
       responses:
         '200':
           description: Página de movimentações
           content:
             application/json:
               schema: { $ref: '#/components/schemas/LedgerEntryPage' }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
         '404': { $ref: '#/components/responses/NotFound' }
     post:
       summary: Registra gasto ou aporte em uma verba
       security: [{ bearerAuth: [] }]
       parameters:
         - in: path
           name: id
           required: true
           schema: { type: string, format: uuid }
       requestBody:
         required: true
         content:
           application/json:
             schema: { $ref: '#/components/schemas/CreateEntry' }
       responses:
         '201':
           description: Movimentação registrada
           content:
             application/json:
               schema: { $ref: '#/components/schemas/LedgerEntry' }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
  /alerts:
    get:
      summary: Lista alertas in-app ativos do titular
      description: >
        Fase 1 (issue #35): saldo negativo persistido sem valores monetários.
        Sem push/e-mail nesta entrega.
      responses:
        '200':
          description: Alertas ativos (não dispensados nem resolvidos)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /alerts/{id}/dismiss:
    post:
      summary: Dispensa um alerta ativo do titular
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Alerta dispensado
        '404':
          description: Alerta inexistente ou de outro titular
        '401': { $ref: '#/components/responses/Unauthorized' }
  /ledger/summary:
     get:
       summary: Resumo financeiro do mês (renda, alocado, não alocado, verbas com saldo)
       security: [{ bearerAuth: [] }]
       parameters:
         - in: query
           name: month
           schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
           description: Mês no formato YYYY-MM; padrão mês corrente em America/Sao_Paulo.
       responses:
         '200':
           description: Resumo do mês
           content:
             application/json:
               schema: { $ref: '#/components/schemas/LedgerSummary' }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
  /history:
     get:
       summary: Lista gastos visíveis no intervalo, paginados e agrupáveis por tipo de verba
       security: [{ bearerAuth: [] }]
       parameters:
         - { in: query, name: from, required: true, schema: { type: string, format: date } }
         - { in: query, name: to, required: true, schema: { type: string, format: date } }
         - { in: query, name: includeDeleted, schema: { type: boolean, default: false }, description: Apenas o owner recebe seus gastos excluídos. }
         - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
         - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
       responses:
         '200': { description: Página de gastos, content: { application/json: { schema: { $ref: '#/components/schemas/HistoryPage' } } } }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
  /history/summary:
     get:
       summary: Retorna agregados do histórico para todo o intervalo
       security: [{ bearerAuth: [] }]
       parameters:
         - { in: query, name: from, required: true, schema: { type: string, format: date } }
         - { in: query, name: to, required: true, schema: { type: string, format: date } }
       responses:
         '200': { description: Cards e séries dos gráficos, content: { application/json: { schema: { $ref: '#/components/schemas/HistorySummary' } } } }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
  /reports/expenses-by-purpose:
     get:
       summary: Exporta gastos por tipo e por verba no período
       security: [{ bearerAuth: [] }]
       parameters:
         - { in: query, name: from, required: true, schema: { type: string, format: date } }
         - { in: query, name: to, required: true, schema: { type: string, format: date } }
         - { in: query, name: format, required: true, schema: { type: string, enum: [csv, xlsx] } }
       responses:
         '200':
           description: Arquivo de relatório
           headers:
             Content-Disposition: { schema: { type: string } }
             Cache-Control: { schema: { type: string, example: no-store } }
           content:
             text/csv: { schema: { type: string, format: binary } }
             application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
  /reports/limit-exceeded-months:
     get:
       summary: Exporta meses completos com saldo negativo em verbas LIMIT
       security: [{ bearerAuth: [] }]
       parameters:
         - { in: query, name: from, required: true, schema: { type: string, format: date } }
         - { in: query, name: to, required: true, schema: { type: string, format: date } }
         - { in: query, name: format, required: true, schema: { type: string, enum: [csv, xlsx] } }
       responses:
         '200':
           description: Arquivo de relatório
           headers:
             Content-Disposition: { schema: { type: string } }
             Cache-Control: { schema: { type: string, example: no-store } }
           content:
             text/csv: { schema: { type: string, format: binary } }
             application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
  /reports/goals-below-target:
     get:
       summary: Exporta metas GOAL abaixo dos aportes esperados em meses completos
       security: [{ bearerAuth: [] }]
       parameters:
         - { in: query, name: from, required: true, schema: { type: string, format: date } }
         - { in: query, name: to, required: true, schema: { type: string, format: date } }
         - { in: query, name: format, required: true, schema: { type: string, enum: [csv, xlsx] } }
       responses:
         '200':
           description: Arquivo de relatório
           headers:
             Content-Disposition: { schema: { type: string } }
             Cache-Control: { schema: { type: string, example: no-store } }
           content:
             text/csv: { schema: { type: string, format: binary } }
             application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
  /ledger/entries/{id}:
     patch:
       summary: Edita valor, verba e descrição de um gasto (autor ou owner da verba; data imutável)
       description: Autorizado se currentUser == authorId do lançamento ou currentUser == ownerId da verba.
       security: [{ bearerAuth: [] }]
       parameters:
         - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
       requestBody:
         required: true
         content: { application/json: { schema: { $ref: '#/components/schemas/UpdateExpense' } } }
       responses:
         '200': { description: Gasto atualizado, content: { application/json: { schema: { $ref: '#/components/schemas/LedgerEntry' } } } }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
     delete:
       summary: Exclui logicamente um gasto (autor ou owner da verba)
       description: Autorizado se currentUser == authorId do lançamento ou currentUser == ownerId da verba.
       security: [{ bearerAuth: [] }]
       parameters:
         - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
       responses:
         '204': { description: Gasto excluído logicamente }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
  /ledger/entries/{id}/revisions:
     get:
       summary: Lista revisões de edição/exclusão de um gasto (somente owner)
       description: >
         Trilha append-only do estado anterior a cada EDIT/DELETE (ADR-0027).
         Participantes não consultam a trilha.
       security: [{ bearerAuth: [] }]
       parameters:
         - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
         - in: query
           name: page
           schema: { type: integer, minimum: 0, default: 0 }
         - in: query
           name: size
           schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
       responses:
         '200':
           description: Revisões mais recentes primeiro
           content:
             application/json:
               schema: { $ref: '#/components/schemas/LedgerEntryRevisionPage' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
  /envelopes/{id}/recurring-entries:
     get:
       summary: Lista recorrências da verba (somente proprietário, ADR-0031)
       security: [{ bearerAuth: [] }]
       parameters:
         - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
       responses:
         '200':
           description: Recorrências não excluídas, por dia do mês
           content:
             application/json:
               schema:
                 type: array
                 items: { $ref: '#/components/schemas/RecurringEntry' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
     post:
       summary: Cria recorrência mensal (somente proprietário)
       security: [{ bearerAuth: [] }]
       parameters:
         - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
       requestBody:
         required: true
         content:
           application/json:
             schema: { $ref: '#/components/schemas/CreateRecurringEntry' }
       responses:
         '201':
           description: Recorrência criada e ativa
           content:
             application/json:
               schema: { $ref: '#/components/schemas/RecurringEntry' }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
  /envelopes/{id}/recurring-entries/{recurringId}:
     put:
       summary: Edita, ativa ou desativa a recorrência; pendências já geradas mantêm o valor sugerido
       security: [{ bearerAuth: [] }]
       parameters:
         - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
         - { in: path, name: recurringId, required: true, schema: { type: string, format: uuid } }
       requestBody:
         required: true
         content:
           application/json:
             schema: { $ref: '#/components/schemas/UpdateRecurringEntry' }
       responses:
         '200':
           description: Recorrência atualizada
           content:
             application/json:
               schema: { $ref: '#/components/schemas/RecurringEntry' }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
         '409': { $ref: '#/components/responses/RecurringConflict' }
     delete:
       summary: Exclui logicamente a recorrência e descarta suas pendências; lançamentos confirmados permanecem
       security: [{ bearerAuth: [] }]
       parameters:
         - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
         - { in: path, name: recurringId, required: true, schema: { type: string, format: uuid } }
       responses:
         '204': { description: Recorrência excluída }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
  /recurring-occurrences/pending:
     get:
       summary: Pendências das verbas de que o usuário é proprietário, do mês e vencidas
       security: [{ bearerAuth: [] }]
       responses:
         '200':
           description: Pendências separadas pela competência em America/Sao_Paulo
           content:
             application/json:
               schema: { $ref: '#/components/schemas/PendingOccurrences' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
  /recurring-occurrences/{occurrenceId}/confirm:
     post:
       summary: Confirma a pendência criando o lançamento (valor e data opcionais; padrão = sugestão e data prevista)
       security: [{ bearerAuth: [] }]
       parameters:
         - { in: path, name: occurrenceId, required: true, schema: { type: string, format: uuid } }
       requestBody:
         required: false
         content:
           application/json:
             schema: { $ref: '#/components/schemas/ConfirmOccurrence' }
       responses:
         '200':
           description: Pendência confirmada
           content:
             application/json:
               schema: { $ref: '#/components/schemas/OccurrenceConfirmation' }
         '400': { $ref: '#/components/responses/InvalidRequest' }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
         '409': { $ref: '#/components/responses/RecurringConflict' }
  /recurring-occurrences/{occurrenceId}/discard:
     post:
       summary: Descarta a pendência sem criar lançamento
       security: [{ bearerAuth: [] }]
       parameters:
         - { in: path, name: occurrenceId, required: true, schema: { type: string, format: uuid } }
       responses:
         '204': { description: Pendência descartada }
         '401': { $ref: '#/components/responses/AuthenticationFailed' }
         '403': { $ref: '#/components/responses/Forbidden' }
         '404': { $ref: '#/components/responses/NotFound' }
         '409': { $ref: '#/components/responses/RecurringConflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
    LoginCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    PasswordResetConfirmation:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token: { type: string, minLength: 1, maxLength: 256 }
        newPassword: { type: string, minLength: 12, maxLength: 128 }
    AddPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 12, maxLength: 128 }
    LoginMethods:
      type: object
      required: [hasPassword, linkedProviders]
      properties:
        hasPassword: { type: boolean }
        linkedProviders:
          type: array
          items: { type: string, enum: [GOOGLE, GITHUB] }
    AuthorizationUrl:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl: { type: string, format: uri }
    MobileHandoffRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 512 }
    MobileSession:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshCookieName]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer }
        refreshToken:
          type: string
          description: Guardado pelo aplicativo com proteção da plataforma; nunca é registrado em log.
        refreshCookieName:
          type: string
          description: >-
            Nome sob o qual o aplicativo deve enviar o refresh em /auth/refresh.
            É configurável por AUTH_COOKIE_NAME, por isso vem na resposta.
    Token:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, const: 900 }
    MfaChallenge:
      type: object
      required: [mfaRequired, challengeId, expiresIn]
      properties:
        mfaRequired: { type: boolean, const: true }
        challengeId: { type: string }
        expiresIn: { type: integer, const: 300 }
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId: { type: string, minLength: 1, maxLength: 512 }
        code: { type: string, minLength: 1, maxLength: 10 }
    MfaRecoveryRequest:
      type: object
      additionalProperties: false
      required: [challengeId, recoveryCode]
      properties:
        challengeId: { type: string, minLength: 1, maxLength: 512 }
        recoveryCode: { type: string, minLength: 1, maxLength: 32 }
    RestrictedToken:
      type: object
      required: [restrictedToken, tokenType, expiresIn]
      properties:
        restrictedToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, const: 600 }
    PasswordConfirmation:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
    MfaCodeConfirmation:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 10 }
    MfaEnrollmentStart:
      type: object
      required: [otpauthUri, qrImageDataUri, manualEntryKey, pendingExpiresAt]
      properties:
        otpauthUri: { type: string }
        qrImageDataUri: { type: string, description: PNG codificado em base64 (data URI) }
        manualEntryKey: { type: string, description: Segredo TOTP em Base32 para configuração manual }
        pendingExpiresAt: { type: string, format: date-time }
    MfaRecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }
    MfaStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [DISABLED, PENDING, ENABLED] }
        pendingExpiresAt: { type: string, format: date-time, nullable: true }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
    CurrentUser:
      type: object
      required: [id, email, emailVerified, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IncomeChange:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          examples: ['5000.00']
    Income:
      type: object
      required: [amount, currency, effectiveFrom, changedAt]
      properties:
        amount: { type: string, pattern: '^\d{1,17}\.\d{2}$', examples: ['5000.00'] }
        currency: { type: string, const: BRL }
        effectiveFrom: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        changedAt: { type: string, format: date-time }
    IncomeHistoryItem:
      allOf:
        - $ref: '#/components/schemas/Income'
        - type: object
          required: [id, changedBy]
          properties:
            id: { type: string, format: uuid }
            changedBy: { type: string, format: uuid }
    InAppAlert:
      type: object
      additionalProperties: false
      required: [id, type, envelopeId, envelopeName, referenceMonth, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [NEGATIVE_BALANCE] }
        envelopeId: { type: string, format: uuid }
        envelopeName: { type: string, maxLength: 80 }
        referenceMonth: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        createdAt: { type: string, format: date-time }
    AlertList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InAppAlert' }
    LedgerEntryRevision:
      type: object
      additionalProperties: false
      required: [id, ledgerEntryId, action, actorUserId, previousEnvelopeId, previousAmount, changedAt]
      properties:
        id: { type: string, format: uuid }
        ledgerEntryId: { type: string, format: uuid }
        action: { type: string, enum: [EDIT, DELETE] }
        actorUserId: { type: string, format: uuid }
        previousEnvelopeId: { type: string, format: uuid }
        previousAmount: { $ref: '#/components/schemas/Money' }
        previousDescription: { type: string, maxLength: 140, nullable: true }
        changedAt: { type: string, format: date-time }
    LedgerEntryRevisionPage:
      type: object
      additionalProperties: false
      required: [items, page, size, hasNext]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntryRevision' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        hasNext: { type: boolean }
    Participant:
      type: object
      additionalProperties: false
      required: [userId, email, addedAt]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
        addedAt: { type: string, format: date-time }
    ParticipantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
    InviteParticipant:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    IncomeHistoryPage:
      type: object
      additionalProperties: false
      required: [items, page, size, hasNext]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IncomeHistoryItem' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        hasNext: { type: boolean }
    RecurringEntry:
      type: object
      required: [id, envelopeId, kind, amount, dayOfMonth, active, firstCompetence, version]
      properties:
        id: { type: string, format: uuid }
        envelopeId: { type: string, format: uuid }
        kind: { type: string, enum: [EXPENSE, CONTRIBUTION] }
        amount: { $ref: '#/components/schemas/Money' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31, description: 'Dia inexistente no mês vira o último dia' }
        description: { type: [string, 'null'], maxLength: 140 }
        active: { type: boolean }
        firstCompetence: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        version: { type: integer }
    CreateRecurringEntry:
      type: object
      required: [kind, amount, dayOfMonth]
      properties:
        kind: { type: string, enum: [EXPENSE, CONTRIBUTION] }
        amount: { $ref: '#/components/schemas/Money' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31 }
        description: { type: [string, 'null'], maxLength: 140 }
    UpdateRecurringEntry:
      allOf:
        - { $ref: '#/components/schemas/CreateRecurringEntry' }
        - type: object
          required: [active]
          properties:
            active: { type: boolean }
    PendingOccurrence:
      type: object
      required: [id, recurringEntryId, envelopeId, envelopeName, kind, suggestedAmount, dueDate, competence]
      properties:
        id: { type: string, format: uuid }
        recurringEntryId: { type: string, format: uuid }
        envelopeId: { type: string, format: uuid }
        envelopeName: { type: string }
        kind: { type: string, enum: [EXPENSE, CONTRIBUTION] }
        description: { type: [string, 'null'] }
        suggestedAmount: { $ref: '#/components/schemas/Money' }
        dueDate: { type: string, format: date }
        competence: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
    PendingOccurrences:
      type: object
      required: [current, overdue]
      properties:
        current: { type: array, items: { $ref: '#/components/schemas/PendingOccurrence' } }
        overdue: { type: array, items: { $ref: '#/components/schemas/PendingOccurrence' } }
    ConfirmOccurrence:
      type: object
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        occurredAt: { type: string, format: date }
    OccurrenceConfirmation:
      type: object
      required: [id, status, ledgerEntryId]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, const: CONFIRMED }
        ledgerEntryId: { type: string, format: uuid }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^\d{1,17}\.\d{2}$', examples: ['400.00'] }
        currency: { type: string, const: BRL }
    MoneyNegative:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^-?\d{1,17}\.\d{2}$', examples: ['-25.00'] }
        currency: { type: string, const: BRL }
    Envelope:
      type: object
      required: [id, ownerId, name, purpose, baseAmount, targetAmount, targetReachedAt, annualExpense, goalProgress, available, isNegative, role, wealthAllocation, createdAt, archivedAt, version]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        purpose: { type: string, enum: [LIMIT, GOAL, FIXED, SAVINGS_TARGET, ANNUAL_EXPENSE] }
        baseAmount: { $ref: '#/components/schemas/Money' }
        targetAmount: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: Obrigatório e positivo somente para SAVINGS_TARGET. }
        targetReachedAt: { type: string, format: date-time, nullable: true }
        annualExpense: { allOf: [{ $ref: '#/components/schemas/AnnualExpense' }], nullable: true }
        goalProgress: { allOf: [{ $ref: '#/components/schemas/GoalProgress' }], nullable: true, description: Preenchido no resumo do ledger somente para GOAL. }
        available:
          allOf: [{ $ref: '#/components/schemas/MoneyNegative' }]
          description: >
            Em GET /envelopes* espelha baseAmount (não é saldo autoritativo).
            Em GET /ledger/summary é o saldo real do mês.
        isNegative:
          type: boolean
          description: Em GET /envelopes* é sempre false; saldo negativo autoritativo vem de /ledger/summary.
        role: { type: string, enum: [OWNER, PARTICIPANT] }
        wealthAllocation:
          type: boolean
          description: >
            Quando true, saídas EXPENSE desta verba contam como alocação de patrimônio
            (`applied`) e não como consumo (`expenses`) no resumo do histórico (ADR-0028).
        createdAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, minimum: 0 }
    CreateEnvelope:
      type: object
      additionalProperties: false
      required: [name, purpose, baseAmount]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        purpose: { type: string, enum: [LIMIT, GOAL, FIXED, SAVINGS_TARGET, ANNUAL_EXPENSE] }
        baseAmount: { $ref: '#/components/schemas/Money' }
        targetAmount: { $ref: '#/components/schemas/Money' }
        annualAmount: { $ref: '#/components/schemas/Money' }
        dueMonth: { type: integer, minimum: 1, maximum: 12 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        fundingMode: { type: string, enum: [MONTHLY, ONE_TIME] }
        wealthAllocation: { type: boolean, default: false }
    UpdateEnvelope:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 0, description: Versão lida no GET/summary; obrigatória para lock otimista. }
        name: { type: string, minLength: 1, maxLength: 80 }
        purpose: { type: string, enum: [LIMIT, GOAL, FIXED, SAVINGS_TARGET, ANNUAL_EXPENSE] }
        baseAmount: { $ref: '#/components/schemas/Money' }
        targetAmount: { $ref: '#/components/schemas/Money' }
        annualAmount: { $ref: '#/components/schemas/Money' }
        dueMonth: { type: integer, minimum: 1, maximum: 12 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        fundingMode: { type: string, enum: [MONTHLY, ONE_TIME] }
        wealthAllocation: { type: boolean }
    AnnualExpense:
      type: object
      additionalProperties: false
      required: [annualAmount, dueMonth, dueDay, fundingMode]
      properties:
        annualAmount: { $ref: '#/components/schemas/Money' }
        dueMonth: { type: integer, minimum: 1, maximum: 12 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        fundingMode: { type: string, enum: [MONTHLY, ONE_TIME] }
    GoalProgress:
      type: object
      required: [plannedAmount, contributedAmount, remainingAmount, percent]
      properties:
        plannedAmount: { $ref: '#/components/schemas/Money' }
        contributedAmount: { $ref: '#/components/schemas/Money' }
        remainingAmount: { $ref: '#/components/schemas/Money' }
        percent: { type: integer, minimum: 0, maximum: 100 }
    LedgerEntry:
      type: object
      required: [id, envelopeId, kind, amount, occurredAt, description, authorId, createdAt, targetJustReached]
      properties:
        id: { type: string, format: uuid }
        envelopeId: { type: string, format: uuid }
        kind: { type: string, enum: [EXPENSE, CONTRIBUTION] }
        amount: { $ref: '#/components/schemas/Money' }
        occurredAt: { type: string, format: date, examples: ['2026-08-27'] }
        description: { type: string, maxLength: 140, nullable: true }
        authorId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        targetJustReached: { type: boolean, description: Verdadeiro somente no aporte que alcançou pela primeira vez o alvo de SAVINGS_TARGET. }
    UpdateExpense:
      type: object
      additionalProperties: false
      required: [envelopeId, amount]
      properties:
        envelopeId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        description: { type: string, maxLength: 140, nullable: true }
    HistoryItem:
      type: object
      required: [entry, envelopeName, purpose, role]
      properties:
        entry: { $ref: '#/components/schemas/LedgerEntry' }
        envelopeName: { type: string }
        purpose: { type: string, enum: [LIMIT, GOAL, FIXED, SAVINGS_TARGET, ANNUAL_EXPENSE] }
        role: { type: string, enum: [OWNER, PARTICIPANT] }
    HistoryPage:
      type: object
      required: [items, page, size, hasNext]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HistoryItem' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        hasNext: { type: boolean }
    HistorySummary:
      type: object
      required: [income, expenses, applied, netBalance, accumulatedBalance, monthlyTotals, purposeTotals]
      properties:
        income: { $ref: '#/components/schemas/Money' }
        expenses:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Consumo do período — EXPENSE em verbas com wealthAllocation=false.
        applied:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Alocação de patrimônio — EXPENSE em verbas com wealthAllocation=true (ADR-0028).
        netBalance:
          allOf: [{ $ref: '#/components/schemas/MoneyNegative' }]
          description: income − expenses − applied.
        accumulatedBalance: { $ref: '#/components/schemas/MoneyNegative' }
        monthlyTotals:
          type: array
          items:
            type: object
            required: [month, amount]
            properties:
              month: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' }
              amount: { $ref: '#/components/schemas/Money' }
        purposeTotals:
          type: array
          items:
            type: object
            required: [purpose, amount]
            properties:
              purpose: { type: string, enum: [LIMIT, GOAL, FIXED, SAVINGS_TARGET, ANNUAL_EXPENSE] }
              amount: { $ref: '#/components/schemas/Money' }
    CreateEntry:
      type: object
      additionalProperties: false
      required: [kind, amount, occurredAt]
      properties:
        kind: { type: string, enum: [EXPENSE, CONTRIBUTION] }
        amount: { $ref: '#/components/schemas/Money' }
        occurredAt: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
        description: { type: string, maxLength: 140, nullable: true }
    LedgerEntryPage:
      type: object
      required: [items, page, size, hasNext]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        hasNext: { type: boolean }
    LedgerSummary:
      type: object
      required: [income, allocated, unallocated, usagePct, envelopes]
      properties:
        income:
          nullable: true
          type: object
          required: [amount, currency, effectiveFrom, changedAt]
          properties:
            amount: { type: string, pattern: '^\d{1,17}\.\d{2}$' }
            currency: { type: string, const: BRL }
            effectiveFrom: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
            changedAt: { type: string, format: date-time }
        allocated: { $ref: '#/components/schemas/Money' }
        unallocated: { $ref: '#/components/schemas/Money' }
        usagePct: { type: number, minimum: 0, description: 'Percentual da renda alocada, com escala 2 e arredondamento HALF_UP.' }
        envelopes: { type: array, items: { $ref: '#/components/schemas/Envelope' } }
  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, github] }
  responses:
    InvalidRequest:
      description: Dados inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AuthenticationFailed:
      description: Resposta genérica de autenticação
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyAttempts:
      description: Janela de tentativas excedida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MfaAlreadyEnabled:
      description: MFA já está ativo para esta conta
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MfaNotEnabled:
      description: MFA não está ativo para esta conta
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IncomeNotConfigured:
      description: Não existe renda efetiva no mês solicitado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IncomeConflict:
      description: Renda abaixo das verbas-base ou alteração concorrente
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RecurringConflict:
      description: Pendência já confirmada/descartada, recorrência excluída ou alteração concorrente
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Recurso não encontrado ou não autorizado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Operação não permitida para o papel do usuário
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
