name: controle-gastos

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_gastos}
      POSTGRES_USER: ${POSTGRES_USER:-controle_gastos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-test-only}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: controle-gastos-backend:latest
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-controle_gastos}
      DATABASE_USERNAME: ${POSTGRES_USER:-controle_gastos}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-test-only}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-refresh_token}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-controle-gastos-api}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-controle-gastos-clients}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-test-only-change-before-production-at-least-32-bytes}
      AUTH_ACCESS_TOKEN_LIFETIME: ${AUTH_ACCESS_TOKEN_LIFETIME:-15m}
      AUTH_REFRESH_IDLE_LIFETIME: ${AUTH_REFRESH_IDLE_LIFETIME:-30d}
      AUTH_SESSION_ABSOLUTE_LIFETIME: ${AUTH_SESSION_ABSOLUTE_LIFETIME:-365d}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH_ATTEMPT_HMAC_SECRET: ${AUTH_ATTEMPT_HMAC_SECRET:-test-only-change-before-production}
      AUTH_TOTP_ENCRYPTION_KEY: ${AUTH_TOTP_ENCRYPTION_KEY:-VU9baFBfsK16dNGrY4PMI+i2bt9jszxJ1QWmhyBNTLo=}
      AUTH_TOTP_ENCRYPTION_KEY_VERSION: ${AUTH_TOTP_ENCRYPTION_KEY_VERSION:-1}
      AUTH_MFA_LOGIN_CHALLENGE_LIFETIME: ${AUTH_MFA_LOGIN_CHALLENGE_LIFETIME:-5m}
      AUTH_MFA_PENDING_SETUP_LIFETIME: ${AUTH_MFA_PENDING_SETUP_LIFETIME:-10m}
      AUTH_MFA_RECOVERY_SESSION_LIFETIME: ${AUTH_MFA_RECOVERY_SESSION_LIFETIME:-10m}
      AUTH_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      AUTH_PASSWORD_RESET_MAIL_ENABLED: ${AUTH_PASSWORD_RESET_MAIL_ENABLED:-false}
      GMAIL_SMTP_HOST: smtp.gmail.com
      GMAIL_SMTP_PORT: "587"
      GMAIL_SMTP_USERNAME: ${GMAIL_SMTP_USERNAME:-}
      GMAIL_SMTP_APP_PASSWORD: ${GMAIL_SMTP_APP_PASSWORD:-}
      GMAIL_SMTP_FROM: ${GMAIL_SMTP_USERNAME:-}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: controle-gastos-web:latest
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
