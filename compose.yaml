name: controle-gastos

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_gastos}
      POSTGRES_USER: ${POSTGRES_USER:-controle_gastos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-controle_gastos}
      DATABASE_USERNAME: ${POSTGRES_USER:-controle_gastos}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-refresh_token}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-controle-gastos-api}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-controle-gastos-clients}
      AUTH_ACCESS_TOKEN_LIFETIME: ${AUTH_ACCESS_TOKEN_LIFETIME:-15m}
      AUTH_REFRESH_IDLE_LIFETIME: ${AUTH_REFRESH_IDLE_LIFETIME:-30d}
      AUTH_SESSION_ABSOLUTE_LIFETIME: ${AUTH_SESSION_ABSOLUTE_LIFETIME:-365d}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AUTH_ATTEMPT_HMAC_SECRET: ${AUTH_ATTEMPT_HMAC_SECRET:-local-only-change-me}
      AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:-local-ephemeral}
      AUTH_JWT_PRIVATE_KEY_PATH: ${AUTH_JWT_PRIVATE_KEY_PATH:-}
      AUTH_JWT_PUBLIC_KEY_PATH: ${AUTH_JWT_PUBLIC_KEY_PATH:-}
      AUTH_JWT_PREVIOUS_PUBLIC_KEY_PATH: ${AUTH_JWT_PREVIOUS_PUBLIC_KEY_PATH:-}
      AUTH_JWT_PREVIOUS_KEY_ID: ${AUTH_JWT_PREVIOUS_KEY_ID:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
